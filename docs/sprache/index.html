<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101115" />
    <title data-i18n="language">Sprache</title>
    <link rel="canonical" href="https://opennava.site/sprache/" />
    <link rel="icon" href="../assets/opennava-mark.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="../assets/fonts/Manrope.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../navigation.css" />
    <link rel="stylesheet" href="../brand.css" />
    <link rel="stylesheet" href="./language.css" />
    <script src="../site-i18n.js" defer></script>
    <script src="../navigation.js" defer></script>
    <script src="./language.js" defer></script>
  </head>
  <body data-page="language">
    <a class="skip" href="#main" data-i18n="skip">Zum Inhalt</a>
    <header class="mast frame">
      <a
        class="brand"
        aria-label="OpenNava und Luna Browser, zur Startseite"
        data-i18n-aria-label="homeLink"
        href="../"
        ><span class="wordmark" translate="no">Opennava</span></a
      >
    </header>
    <main id="main">
      <section class="language-scene frame" aria-labelledby="language-title">
        <header>
          <h1 id="language-title" data-i18n="language">Sprache</h1>
          <p
            class="language-hint"
            id="language-hint"
            data-i18n="languageWheelHint"
          >
            Wähle deine Sprache.
          </p>
        </header>
        <div class="language-wheel-wrap">
          <div
            id="language-wheel"
            role="listbox"
            tabindex="0"
            aria-labelledby="language-title"
            aria-describedby="language-hint"
            aria-orientation="vertical"
          ></div>
          <div class="language-wheel-selection" aria-hidden="true"></div>
          <div class="language-wheel-fade" aria-hidden="true"></div>
        </div>
        <a
          id="language-done"
          class="button light"
          href="../"
          data-i18n="languageDone"
          >Fertig</a
        >
      </section>
    </main>
    <footer class="site-footer frame">
      <a href="https://github.com/fcore247/opennava">GitHub</a>
      <nav
        class="footer-products"
        aria-label="Produkte"
        data-i18n-aria-label="products"
      >
        <a href="../luna/"
          ><img
            src="../assets/luna-icon.svg"
            alt=""
            width="24"
            height="24"
          />Luna Browser <span aria-hidden="true">↗</span></a
        >
        <a href="../"
          ><img
            src="../assets/opennava-mark.svg"
            alt=""
            width="26"
            height="24"
          />OpenNava <span aria-hidden="true">↗</span></a
        >
      </nav>
      <a
        class="site-language-button"
        data-language-link
        href="./"
        aria-current="page"
      >
        <svg
          aria-hidden="true"
          focusable="false"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        >
          <circle cx="12" cy="12" r="9"></circle>
          <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
          <path d="M3 12h18"></path>
        </svg>
        <span data-i18n="language">Sprache</span>
      </a>
    </footer>
  </body>
</html>
