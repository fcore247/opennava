<html lang="en">
<head>

  <title>OpenNava — Your TV home</title>
  <link rel="icon" href="brand.svg">
  <link rel="stylesheet" href="styles.css?v=1ff03364486b">
  <link rel="stylesheet" href="tube.css?v=3e4eff4da0d7">

  <script src="liquid-nav.js?v=2fb3db637622" defer></script>
  <script src="app.js?v=decd2798bb5b" defer></script>
  <script src="tube.js?v=e1f47ced83c9" defer></script>

</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <header class="header">
    <button class="brand" data-action="home" aria-label="OpenNava home"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 44" fill="none"><defs><linearGradient id="a" x1="5" y1="32" x2="44" y2="4" gradientUnits="userSpaceOnUse"><stop stop-color="#9daffc"/><stop offset=".52" stop-color="#c4a9f1"/><stop offset="1" stop-color="#f6b9a3"/></linearGradient></defs><path d="M2 38 19 6h12L14 38H2Z" fill="url(#a)"/><path d="m20 6 14 24 7-13 11 21H34L17 12l3-6Z" fill="url(#a)"/></svg><span>OpenNava</span></button>
    <nav aria-label="Main navigation">
      <button class="nav-button active" data-view="home" aria-current="page">Home</button>
      <button class="nav-button" data-view="discover">Discover</button>
      <button class="nav-button" data-view="library">My list</button>
    </nav>
    <div class="header-tools">
      <button class="icon-button" data-action="search" aria-label="Search" data-icon="search"></button>
      <button class="icon-button" data-action="settings" aria-label="Settings" data-icon="settings"></button>
      <span class="header-divider"></span><time id="clock">--:--</time>
      <button class="avatar" data-action="profile" aria-label="Edit profile">F</button>
    </div>
  </header>
  <main id="main"></main>
  <nav id="bottom-navigation" aria-label="Main navigation" data-liquid-nav></nav>
  <footer>
    <div class="keyboard-hints"><span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> Navigate</span><span><kbd>↵</kbd> Select</span><span><kbd>esc</kbd> Back</span></div>
    <span class="prototype-label"><span></span> LAUNCHER PREVIEW <i>·</i> DEMO CONTENT</span>
    <button class="footer-fullscreen" data-action="fullscreen">Full screen <span data-icon="expand"></span></button>
  </footer>
  <dialog id="panel" aria-labelledby="panel-title"></dialog>
  <dialog id="player" aria-label="Demo video player"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
