<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101115" />
    <title>Luna Browser</title>
    <meta
      name="description"
      content="Erlebe die Farbwelten, Gesten und Startseite von Luna Browser direkt im Browser."
    />
    <link rel="canonical" href="https://open-nava.com/luna/" />
    <link rel="icon" href="../assets/luna-icon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="../assets/fonts/Manrope.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../navigation.css" />
    <link rel="stylesheet" href="../brand.css" />
    <link rel="stylesheet" href="./luna.css" />
    <script src="../site-i18n.js" defer></script>
    <script src="../navigation.js" defer></script>
    <script src="./luna.js" defer></script>
  </head>
  <body data-page="luna">
    <a class="skip" href="#main" data-i18n="skip">Zum Inhalt</a>
    <header class="mast frame">
      <a
        class="brand"
        href="./"
        aria-label="Luna Browser, zur Startseite"
        data-i18n-aria-label="lunaHomeLink"
      >
        <img
          class="luna-wordmark"
          src="../assets/luna-wordmark.svg"
          width="210"
          height="48"
          alt=""
        />
      </a>
    </header>
    <main id="main">
      <h1 class="sr-only" lang="en" translate="no">Luna Browser</h1>
      <section
        class="luna-scene frame"
        aria-label="Luna Browser ausprobieren"
        data-i18n-aria-label="lunaDemoFrame"
      >
        <iframe
          id="luna-demo-frame"
          src="./demo/"
          title="Luna Browser ausprobieren"
          data-i18n-title="lunaDemoFrame"
          aria-describedby="luna-demo-hint"
          sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
        ></iframe>
      </section>
      <p
        class="luna-demo-label frame"
        id="luna-demo-hint"
        data-i18n="lunaDemoIntroHint"
      >
        Probiere Farbwelten, Gesten und die Uhr aus.
      </p>
      <section
        class="home-download frame"
        aria-labelledby="luna-download-title"
      >
        <h2 id="luna-download-title" data-i18n="lunaHomeDownloadTitle">
          Luna für deinen Desktop.
        </h2>
        <a class="home-download-button" href="./download/" data-i18n="download"
          >Download</a
        >
      </section>
    </main>
    <footer class="site-footer frame">
      <a href="https://github.com/fcore247/luna-browser">GitHub</a>
      <nav
        class="footer-products"
        aria-label="Produkte"
        data-i18n-aria-label="products"
      >
        <a href="../luna/"
          ><img
            src="../assets/luna-icon.svg"
            alt=""
            width="24"
            height="24"
          />Luna Browser <span aria-hidden="true">↗</span></a
        >
        <a href="../"
          ><img
            src="../assets/opennava-mark.svg"
            alt=""
            width="26"
            height="24"
          />OpenNava <span aria-hidden="true">↗</span></a
        >
      </nav>
      <a class="site-language-button" data-language-link href="../sprache/">
        <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="9"></circle>
          <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
          <path d="M3 12h18"></path>
        </svg>
        <span data-i18n="language">Sprache</span>
      </a>
    </footer>
  </body>
</html>
