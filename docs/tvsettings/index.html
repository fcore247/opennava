<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#211d24" />
    <title data-i18n="tvPreferences">TV-Einstellungen</title>
    <link rel="icon" href="../assets/luna-icon.svg" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../navigation.css" />
    <link rel="stylesheet" href="./settings.css" />
    <script src="../site-i18n.js" defer></script>
    <script src="../navigation.js" defer></script>
    <script src="../demo-settings.js" defer></script>
    <script src="./settings-page.js" defer></script>
  </head>
  <body data-page="settings" class="settings-page" data-luna-theme="rose">
    <a class="skip" href="#main" data-i18n="skip">Zum Inhalt</a>
    <header class="mast frame">
      <a
        class="brand"
        aria-label="OpenNava und Luna Browser, zur Startseite"
        href="../"
        data-i18n-aria-label="homeLink"
        ><img
          src="../assets/opennava-mark.svg"
          width="28"
          height="24"
          alt=""
        />OpenNava <span class="cross" aria-hidden="true">×</span
        ><img
          src="../assets/luna-icon.svg"
          width="24"
          height="24"
          alt=""
        /><span>Luna<span class="brand-extra"> Browser</span></span></a
      >
    </header>
    <main id="main" class="prefs-main">
      <aside class="prefs-sidebar">
        <div class="prefs-address">
          <img
            src="../assets/opennava-mark.svg"
            width="26"
            height="26"
            alt=""
          />tvsettings
        </div>
        <h1 data-i18n="tvPreferences">TV-Einstellungen</h1>
        <nav
          class="prefs-menu"
          aria-label="Einstellungsbereiche"
          data-i18n-aria-label="tvPreferences"
        >
          <button
            type="button"
            data-section="home"
            aria-current="page"
            aria-controls="prefs-home"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m3 10 9-7 9 7v10h-6v-7H9v7H3z" /></svg
            ><span data-i18n="homeNav">Startseite</span>
          </button>
          <button
            type="button"
            data-section="libraries"
            aria-controls="prefs-libraries"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M3 5v15m5-15v15m4-15 5-1 4 15-5 1z" /></svg
            ><span data-i18n="libraries">Mediatheken</span>
          </button>
          <button
            type="button"
            data-section="appearance"
            aria-controls="prefs-appearance"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <path d="M12 4a8 8 0 0 1 0 16z" /></svg
            ><span data-i18n="appearanceNav">Darstellung</span>
          </button>
        </nav>
        <a
          class="text-link prefs-return"
          data-return-demo
          href="../demo/"
          data-i18n="returnLuna"
          >Zurück zu Luna</a
        >
      </aside>
      <form id="demo-tv-settings">
        <section
          id="prefs-home"
          data-pane="home"
          aria-labelledby="prefs-home-title"
        >
          <h2 id="prefs-home-title" data-i18n="homeTiles">Startkacheln</h2>
          <div class="prefs-tiles" id="tile-selects"></div>
          <div class="library-options prefs-flags">
            <label
              ><span data-i18n="clock">Uhr anzeigen</span
              ><input type="checkbox" id="show-clock" /></label
            ><label
              ><span data-i18n="count">Anzahl der Vormerkungen</span
              ><input type="checkbox" id="show-count"
            /></label>
          </div>
        </section>
        <section
          id="prefs-libraries"
          data-pane="libraries"
          aria-labelledby="prefs-libraries-title"
          hidden
        >
          <h2 id="prefs-libraries-title" data-i18n="libraries">Mediatheken</h2>
          <div class="library-options">
            <label
              >ARD <input type="checkbox" name="library" value="ard" /></label
            ><label
              >ZDF <input type="checkbox" name="library" value="zdf" /></label
            ><label
              >ARTE <input type="checkbox" name="library" value="arte"
            /></label>
          </div>
          <div class="prefs-pair">
            <label
              ><span data-i18n="defaultProvider">Standard-Suchdienst</span
              ><select id="search-provider"></select
            ></label>
          </div>
        </section>
        <section
          id="prefs-appearance"
          data-pane="appearance"
          aria-labelledby="prefs-appearance-title"
          hidden
        >
          <h2 id="prefs-appearance-title" data-i18n="appearanceNav">
            Darstellung
          </h2>
          <div class="prefs-pair">
            <label
              ><span data-i18n="appearance">Farbschema</span
              ><select id="tv-appearance">
                <option value="graphite" data-i18n="graphite">Graphit</option>
                <option value="rose" data-i18n="rose">Rosé</option>
              </select></label
            ><label
              ><span data-i18n="language">Sprache</span
              ><select id="tv-language"></select
            ></label>
          </div>
        </section>
        <div class="prefs-actions">
          <button
            class="button outline"
            id="reload-tv"
            type="button"
            data-i18n="reload"
          >
            Neu laden</button
          ><button class="button light" type="submit" data-i18n="applyTV">
            Auf dem Demo-TV ansehen
          </button>
        </div>
      </form>
    </main>
    <footer class="site-footer frame">
      <a href="https://github.com/fcore247/opennava">GitHub</a>
      <nav
        class="footer-products"
        aria-label="Produkte"
        data-i18n-aria-label="products"
      >
        <a href="../luna/"
          ><img
            src="../assets/luna-icon.svg"
            alt=""
            width="24"
            height="24"
          />Luna Browser <span aria-hidden="true">↗</span></a
        >
        <a href="../"
          ><img
            src="../assets/opennava-mark.svg"
            alt=""
            width="26"
            height="24"
          />OpenNava <span aria-hidden="true">↗</span></a
        >
      </nav>
      <a class="site-language-button" data-language-link href="../sprache/">
        <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="9"></circle>
          <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
          <path d="M3 12h18"></path>
        </svg>
        <span data-i18n="language">Sprache</span>
      </a>
    </footer>
  </body>
</html>
