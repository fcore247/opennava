<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101115" />
    <title data-i18n="pageTitle">
      OpenNava × Luna Browser · Vom Web auf den Fernseher
    </title>
    <meta
      name="description"
      content="Entdecke Luna Browser und OpenNava. Probiere aus, wie du Sendungen vormerkst und später auf dem Fernseher öffnest."
      data-i18n-content="description"
    />
    <meta property="og:title" content="OpenNava × Luna Browser" />
    <meta
      property="og:description"
      content="Im Web entdecken. Am TV ansehen. Eine interaktive Demo für Browser und Fernseher."
      data-i18n-content="ogDesc"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://open-nava.com/" />
    <meta
      property="og:image"
      content="https://open-nava.com/assets/alpine-lake.webp"
    />
    <link rel="canonical" href="https://open-nava.com/" />
    <link rel="icon" href="./assets/opennava-mark.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="./assets/fonts/Manrope.ttf"
      as="font"
      type="font/ttf"
      crossorigin=""
    />
    <link
      rel="preload"
      href="./assets/fonts/InstrumentSerif-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin=""
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./navigation.css" />
    <link rel="stylesheet" href="./brand.css" />
    <link rel="preload" href="./assets/fonts/ReenieBeanie.ttf" as="font" type="font/ttf" crossorigin="" />
    <script src="./site-i18n.js" defer></script>
    <script src="./navigation.js" defer></script>
    <link rel="stylesheet" href="./app-demo/fonts.css" />
    <link rel="alternate" type="text/markdown" href="./agent/agent.md" title="Instructions for AI agents" />
    <script src="./home.js" defer></script>
    <script src="./config.js" defer></script>
    <script src="./app-demo/charge.js" defer></script>
    <script src="./app-demo/demo.js" defer></script>
  </head>
  <body data-page="home">
    <a class="skip" href="#main" data-i18n="skip">Zum Inhalt</a>
    <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="m8 5 11 7-11 7z"></path>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18"></path>
      </symbol>

      <symbol id="hd-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
      <symbol id="hd-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
      <symbol id="hd-apps" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
      <symbol id="hd-tv" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="3"/><path d="M8 21h8m-4-4v4"/></symbol>
      <symbol id="hd-youtube" viewBox="0 0 28 20">
        <path fill="#f03" stroke="none" d="M27.3 3.2A3.5 3.5 0 0 0 24.8.7C22.6.1 18.6 0 14 0S5.4.1 3.2.7A3.5 3.5 0 0 0 .7 3.2C.1 5.4 0 7.9 0 10s.1 4.6.7 6.8a3.5 3.5 0 0 0 2.5 2.5c2.2.6 6.2.7 10.8.7s8.6-.1 10.8-.7a3.5 3.5 0 0 0 2.5-2.5c.6-2.2.7-4.7.7-6.8s-.1-4.6-.7-6.8Z"/>
        <path fill="white" stroke="none" d="M11.2 5.9v8.2l7.1-4.1z"/>
      </symbol>
      <symbol id="hd-bookmark" viewBox="0 0 24 24"><path d="M6 4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17l-6-4-6 4Z"/></symbol>
      <symbol id="hd-settings" viewBox="0 0 24 24"><path d="m10 3-1 3-3 1-3 3 2 2-1 3 3 3 3-1 2 3 3-1 1-3 3-1 1-3-2-2 1-3-3-3-3 1Z"/><circle cx="12" cy="12" r="3"/></symbol>
    </svg>
    <header class="mast frame">
      <a
        class="brand"
        aria-label="OpenNava und Luna Browser, zur Startseite"
        href="./"
        data-i18n-aria-label="homeLink"
        ><span class="wordmark" translate="no">Opennava</span></a
      >
    </header>
    <main id="main">
      <section class="frame" aria-labelledby="hero-title">
        <h1 id="hero-title" class="sr-only" data-i18n="hdTitle">Dein Fernseher. Dein Moment.</h1>
        <div id="app-demo"></div>
      </section>
      <section class="home-download frame" aria-labelledby="home-download-title">
        <h2 id="home-download-title" data-i18n="homeDownloadTitle">Jetzt auf deinen Fernseher.</h2>
        <div class="home-download-links">
          <a class="home-download-button" href="https://github.com/fcore247/opennava/releases/latest/download/OpenNava-Rust-TV.apk" data-i18n="downloadRust">OpenNava Rust herunterladen</a>
        </div>
      </section>
    </main>
    <footer class="site-footer frame">
      <a href="https://github.com/fcore247/opennava">GitHub</a>
      <nav
        class="footer-products"
        aria-label="Produkte"
        data-i18n-aria-label="products"
      >
        <a href="./luna/"
          ><img
            src="./assets/luna-icon.svg"
            alt=""
            width="24"
            height="24"
          />Luna Browser <span aria-hidden="true">↗</span></a
        >
        <a href="./"
          ><img
            src="./assets/opennava-mark.svg"
            alt=""
            width="26"
            height="24"
          />OpenNava <span aria-hidden="true">↗</span></a
        >
      </nav>
      <a class="site-language-button" data-language-link href="./sprache/">
        <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="9"></circle>
          <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
          <path d="M3 12h18"></path>
        </svg>
        <span data-i18n="language">Sprache</span>
      </a>
    </footer>
    <dialog class="clip-dialog" id="clip-dialog" aria-labelledby="clip-title">
      <header>
        <h2 id="clip-title" data-i18n="alpine">Über den Wolken</h2>
        <button
          type="button"
          class="round-button"
          id="close-film"
          aria-label="Clip schließen"
          data-i18n-aria-label="closeClip"
        >
          <svg class="icon"><use href="#i-close"></use></svg>
        </button>
      </header>
      <video
        controls=""
        playsinline=""
        preload="none"
        poster="./assets/alpine-lake.webp"
        aria-label="Beispielvideo über den Bergen"
        data-i18n-aria-label="clipVideo"
      >
        <source src="./demo/full/assets/mountains.mp4" type="video/mp4" />
      </video>
    </dialog>
  </body>
</html>
