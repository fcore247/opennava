plugins { id 'com.android.application' }
android {
    sourceSets.main.java.srcDir(rootProject.file('updates/src/main/java'))
    namespace 'site.navatv.companion'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'site.navatv.companion'
        minSdk 30
        targetSdk 34
        versionCode 100
        versionName '1.0.0'
    }
    sourceSets.main.java.srcDir(layout.buildDirectory.dir('shared-java'))
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('shared-assets'))
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
apply from: 'transport.gradle'
dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.activity:activity:1.8.2'
}

// Share the station catalogue and sample artwork with the television application.
def tvSource = rootProject.file('tv/src/main')
def catalogue = tasks.register('prepareCatalogue', Sync) {
    from(new File(tvSource, 'java')) {
        include 'site/navatv/launcher/MediathekService.java', 'site/navatv/launcher/LiveGuide.java', 'site/navatv/launcher/ArteCatalog.java'
    }
    into layout.buildDirectory.dir('shared-java')
}
def assets = tasks.register('prepareCompanionAssets', Sync) {
    from(new File(tvSource, 'assets/assets')) {
        include 'ard-cover.jpg', 'zdf-cover.jpg', 'arte-cover.jpg', 'fonts/*'
    }
    from(rootProject.file('build/payload/OpenNava.apk'))
    into layout.buildDirectory.dir('shared-assets')
}
tasks.named('preBuild').configure { dependsOn catalogue, assets }
