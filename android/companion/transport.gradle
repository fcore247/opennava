// libadb-android 3.1.1 client sources are vendored to carry the stream and pairing fixes.
android.sourceSets.main.java.srcDir 'vendor/libadb'
dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.github.MuntashirAkon.spake2-java:spake2-android:2.2.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.81'
}
