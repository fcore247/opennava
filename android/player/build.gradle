// Only these local build definitions run. Upstream Gradle/build scripts are not applied.
buildscript {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.9.5'
    }
}

def upstream = new File(System.getenv('NAVATV_PLAYER_SOURCE'))
def previewPairing = providers.gradleProperty('opennavaTvPairing').isPresent()
def intermediates = new File(rootDir, previewPairing ? 'build/preview-modules' : 'build/modules')
def sources = [
    sharedutils: 'SharedModules/sharedutils', commonsio: 'SharedModules/commons-io-2.8.0',
    mediaserviceinterfaces: 'MediaServiceCore/mediaserviceinterfaces', youtubeapi: 'MediaServiceCore/youtubeapi',
    'exo-core': 'exoplayer-amzn-2.10.6/library/core', 'exo-dash': 'exoplayer-amzn-2.10.6/library/dash',
    'exo-hls': 'exoplayer-amzn-2.10.6/library/hls',
    'exo-cronet': 'exoplayer-amzn-2.10.6/extensions/cronet', 'exo-sabr': 'exoplayer-amzn-2.10.6/library/sabr'
]
allprojects {
    repositories { google(); mavenCentral() }
    configurations.all {
        resolutionStrategy.force 'com.squareup.okhttp3:okhttp:3.12.13',
            'org.jetbrains.kotlin:kotlin-stdlib:1.8.10', 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10', 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3',
            'org.chromium.net:cronet-api:105.5195.68'
    }
}
subprojects { sub ->
    buildDir = new File(intermediates, sub.name)
    apply plugin: sub.name == 'app' ? 'com.android.application' : 'com.android.library'
    if (sub.name in ['sharedutils','youtubeapi']) apply plugin: 'org.jetbrains.kotlin.android'
    if (sub.name == 'exo-sabr') apply plugin: 'com.google.protobuf'
    android {
        // Compile pinned upstream libraries against their original API 34 surface.
        // API 36 List.reversed() otherwise shadows Kotlin's Android-11-compatible extension.
        compileSdkVersion sub.name == 'app' ? 36 : 34
        buildToolsVersion '36.0.0'
        defaultConfig { minSdkVersion 26; targetSdkVersion 30 }
        compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
        buildTypes { release { minifyEnabled false } }
        lintOptions { abortOnError false }
        if (sub.name == 'app') {
            namespace 'site.navatv.full'
            defaultConfig { applicationId 'site.navatv.full'; versionCode 4; versionName '0.4.1'; multiDexEnabled true }
            sourceSets.main {
                manifest.srcFile new File(rootDir, 'AndroidManifest.xml')
                java.srcDirs = [new File(rootDir, 'src')]
                res.srcDirs = [new File(rootDir, 'res')]
                assets.srcDirs = [new File(rootDir, 'empty')]
            }
            aaptOptions { noCompress 'mp4','ttf','jpg','png' }
            packagingOptions {
                resources { excludes += ['META-INF/DEPENDENCIES','META-INF/INDEX.LIST','META-INF/*.kotlin_module'] }
                jniLibs { useLegacyPackaging true }
            }
        } else {
            def sourceRoot = new File(upstream, sources[sub.name])
            sourceSets.main {
                manifest.srcFile new File(sourceRoot, 'src/main/AndroidManifest.xml')
                java.srcDirs = [new File(sourceRoot, 'src/main/java')]
                res.srcDirs = [new File(sourceRoot, 'src/main/res')]
                assets.srcDirs = [new File(sourceRoot, 'src/main/assets')]
                // Intentionally no upstream precompiled native libraries.
            }
            if (sub.name == 'sharedutils') {
                sourceSets.main.java.srcDirs += [new File(rootDir, 'overrides/sharedutils')]
                sourceSets.main.java.exclude 'com/liskovsoft/sharedutils/mylogger/SystemLogger.java'
            }
            if (sub.name == 'exo-sabr') sourceSets.main.proto.srcDirs = [new File(sourceRoot, 'src/main/proto')]
        }
    }
    if (previewPairing && sub.name in ['youtubeapi', 'sharedutils']) {
        // Apply the TV-specific adaptations only in the native preview export. Keep pinned
        // source checkouts untouched and the stable launcher's standard player libraries intact.
        def javaRoot = new File(upstream, sources[sub.name] + '/src/main/java')
        def generated = layout.buildDirectory.dir('generated/openNavaPairing')
        def replacements = sub.name == 'sharedutils'
                ? ['com/liskovsoft/sharedutils/prefs/GlobalPreferences.java']
                : ['com/liskovsoft/youtubeapi/auth/V2/AuthApiHelper.java',
                   'com/liskovsoft/youtubeapi/service/internal/YouTubeAccountManager.java',
                   'com/liskovsoft/googlecommon/common/helpers/RetrofitHelper.java']
        def preparePairing = tasks.register('prepareOpenNavaPairing', Sync) {
            from(new File(rootDir, '../../rust-tv/player/overrides/' + sub.name))
            replacements.each { path ->
                from(new File(javaRoot, path)) {
                    filter { line ->
                        line.replace(' https://www.googleapis.com/auth/youtube-paid-content', '')
                            .replace('return getData(MEDIA_SERVICE_ACCOUNT_DATA);',
                                'return OpenNavaAccountStorage.read(this, MEDIA_SERVICE_ACCOUNT_DATA);')
                            .replace('setData(MEDIA_SERVICE_ACCOUNT_DATA, data);',
                                'OpenNavaAccountStorage.write(this, MEDIA_SERVICE_ACCOUNT_DATA, data);')
                            .replace('private boolean mStorageSynced;', 'private boolean mStorageSynced, mAccountsRestored;')
                            .replace('public void init() {', 'public synchronized void init() {')
                            .replace('        restoreAccounts();',
                                '        if (!mAccountsRestored) { restoreAccounts(); mAccountsRestored = true; }')
                            .replace('if (!auth) {', 'if (!auth) { OpenNavaSearchScope.requireGuestForAnonymousSearch(wrapper);')
                            .replace('getAuthService().getAccessTokenWait(userCodeResult.getDeviceCode())',
                                'OpenNavaDeviceGrant.waitFor(userCodeResult, emitter)')
                            .replace('persistRefreshToken(token.getRefreshToken());',
                                'if (token == null || emitter.isDisposed()) return; ' +
                                'synchronized (OpenNavaDeviceGrant.class) { ' +
                                'if (emitter.isDisposed()) return; ' +
                                'persistRefreshToken(token.getRefreshToken()); ' +
                                'if (emitter.isDisposed()) for (Account saved : new java.util.ArrayList<>(mAccounts)) removeAccount(saved); }')
                    }
                }
            }
            into generated
        }
        replacements.each { android.sourceSets.main.java.exclude(it) }
        android.sourceSets.main.java.srcDir(generated)
        preBuild.dependsOn preparePairing
    }
    if (sub.name in ['sharedutils','youtubeapi']) android.kotlinOptions { jvmTarget = '1.8' }
    dependencies {
        if (sub.name == 'app') {
            implementation project(':youtubeapi'); implementation project(':mediaserviceinterfaces'); implementation project(':sharedutils')
            implementation project(':exo-core'); implementation project(':exo-dash'); implementation project(':exo-hls'); implementation project(':exo-sabr'); implementation project(':exo-cronet')
            implementation 'org.chromium.net:cronet-api:105.5195.68'
            implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'; implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
        }
        if (sub.name == 'sharedutils') {
            implementation project(':commonsio')
            implementation 'androidx.appcompat:appcompat:1.2.0'; implementation 'androidx.preference:preference:1.1.0'
            implementation 'com.squareup.okhttp3:okhttp:3.12.13'; implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:3.12.13'
            implementation 'com.squareup.okhttp3:logging-interceptor:3.12.13'; implementation 'com.squareup.okhttp3:okhttp-brotli:4.1.0'
            implementation('com.localebro:okhttpprofiler:1.0.8') { exclude group:'com.squareup.okhttp3', module:'okhttp' }
            implementation 'org.chromium.net:cronet-api:105.5195.68'; implementation 'org.chromium.net:cronet-embedded:105.5195.68'
            implementation 'com.google.code.gson:gson:2.8.2'; implementation 'com.jakewharton:disklrucache:2.0.2'
            implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'; implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
            implementation 'info.guardianproject.netcipher:netcipher:2.1.0'; implementation 'dnsjava:dnsjava:2.1.9'
            implementation 'androidx.core:core-ktx:1.12.0'; implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
        }
        if (sub.name == 'mediaserviceinterfaces') {
            implementation project(':sharedutils')
            implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'; implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
            implementation 'androidx.annotation:annotation:1.1.0'
        }
        if (sub.name == 'youtubeapi') {
            implementation project(':commonsio'); implementation project(':sharedutils'); implementation project(':mediaserviceinterfaces')
            implementation 'com.squareup.retrofit2:retrofit:2.5.0'; implementation 'com.squareup.retrofit2:converter-gson:2.5.0'
            implementation 'com.google.code.gson:gson:2.8.2'; implementation 'com.jayway.jsonpath:json-path:2.4.0'
            implementation 'com.google.net.cronet:cronet-okhttp:0.1.0'; implementation 'org.chromium.net:cronet-api:105.5195.68'
            implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'; implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
            implementation 'androidx.annotation:annotation:1.1.0'
            // Same published dependency used by SmartTube's F-Droid flavor, not repository .so binaries.
            implementation 'com.eclipsesource.j2v8:j2v8:6.2.1@aar'
            implementation 'androidx.core:core-ktx:1.12.0'; implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
            implementation 'com.github.florianingerl.util:regex:1.1.11'
            implementation 'androidx.webkit:webkit:1.11.0'; implementation 'com.grack:nanojson:1.7'
        }
        if (sub.name.startsWith('exo-')) {
            implementation 'androidx.annotation:annotation:1.1.0'
            compileOnly 'org.checkerframework:checker-qual:2.5.0'
            if (sub.name == 'exo-cronet') implementation 'org.chromium.net:cronet-api:105.5195.68'
            if (sub.name == 'exo-core') {
                implementation project(':sharedutils')
                compileOnly 'org.checkerframework:checker-compat-qual:2.5.0'
            } else implementation project(':exo-core')
            if (sub.name in ['exo-dash','exo-sabr']) {
                implementation project(':mediaserviceinterfaces'); implementation project(':sharedutils'); implementation project(':youtubeapi')
            }
            if (sub.name == 'exo-sabr') implementation 'com.google.protobuf:protobuf-javalite:3.17.3'
        }
    }
    if (sub.name == 'exo-sabr') protobuf {
        protoc { artifact = 'com.google.protobuf:protoc:3.17.3' }
        generateProtoTasks { all().configureEach { task -> task.builtins { java { option 'lite' } } } }
    }
}
