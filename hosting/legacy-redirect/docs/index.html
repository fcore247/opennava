<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>OpenNava has moved</title>
  <link rel="canonical" href="https://opennava.site/">
  <script>
    const target = new URL('https://opennava.site/');
    target.pathname = window.location.pathname;
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target.href);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=https://opennava.site/"></noscript>
</head>
<body><p>OpenNava has moved to <a href="https://opennava.site/">opennava.site</a>.</p></body>
</html>
